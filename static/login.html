<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>登录 · NetBird 更新台</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <main class="login-wrap">
      <form class="login-card" id="login-form" autocomplete="on">
        <div class="login-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>NetBird 更新台</h1>
            <p>按优先级把更新脚本发到各台机器</p>
          </div>
        </div>

        <label class="field">
          <span class="login-label">用户名</span>
          <input class="input" id="login-user" name="username" value="admin" autocomplete="username" required />
        </label>

        <label class="field">
          <span class="login-label">密码</span>
          <input class="input" id="login-pass" name="password" type="password" autocomplete="current-password" required autofocus />
        </label>

        <p class="login-error" id="login-error" hidden></p>

        <button class="btn btn-primary login-submit" type="submit" id="login-submit">登录</button>
      </form>
      <p class="login-note">密码就是部署时设置的 <code>NB_COM_PASSWORD</code></p>
    </main>
    <script src="login.js"></script>
  </body>
</html>
