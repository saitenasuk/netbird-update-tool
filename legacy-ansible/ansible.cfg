[defaults]
inventory = inventory.yml
timeout = 15
deprecation_warnings = False
interpreter_python = auto_silent
# 首次连接新机器会因 host key 校验失败，先把公钥指纹写进 known_hosts：
#   ssh-keyscan -H 1.2.3.4 >> ~/.ssh/known_hosts
# 实在不想管就打开下面这行（会跳过校验，不推荐）：
# host_key_checking = False

[ssh_connection]
pipelining = True
# ServerAlive* 让"NetBird 停掉导致连接静默断开"能被几秒内发现，而不是卡到超时
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=5 -o ServerAliveCountMax=3
